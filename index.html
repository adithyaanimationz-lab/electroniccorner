<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Electronic Corner · Trending gadgets delivered across India</title>
<meta name="description" content="Wireless earbuds, neckband earphones, smartwatches, power banks and Bluetooth speakers at great prices. Free delivery across India.">
<meta name="theme-color" content="#080c16">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Electronic Corner — dark store look: sticky bar, product grid, slide-in cart, Amazon-style product pages, admin with stat tiles. */
:root{
  --bg:#080c16; --panel:#0f1729; --panel-2:#131d33; --line:#1d2842; --line-2:#26345a;
  --fg:#e8edf7; --muted:#8b97b3; --dim:#6b7895;
  --accent:#0ea5ff; --accent-ink:#04121f; --accent-soft:rgba(14,165,255,.12);
  --good:#22c58b; --warn:#f5b03d; --bad:#f2546b;
  --photo:#ffffff;
  --buy:#f5b03d; --buy-ink:#1d1405;
  --display:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--display);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
img{max-width:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(8,12,22,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.01em;color:var(--fg);text-decoration:none;white-space:nowrap}
.brand img{width:30px;height:30px;border-radius:50%}
.brand .tag{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.top nav{margin-left:auto;display:flex;align-items:center;gap:4px}
.navlink{background:none;border:0;color:var(--muted);padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:500;white-space:nowrap}
.navlink:hover{color:var(--fg)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:9px 14px;font-weight:700;border:1px solid var(--line-2);background:var(--panel);color:var(--fg);text-decoration:none}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.count{font-family:var(--mono);font-size:12px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px;min-width:20px;text-align:center}

/* hero */
.hero{padding-block:56px 36px;max-width:780px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:clamp(34px,5.4vw,58px);line-height:1.02;letter-spacing:-.035em;font-weight:800;margin:14px 0 16px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{color:var(--muted);font-size:17px;max-width:46ch;margin:0 0 24px}
.perks{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:13px}
.perks span{display:inline-flex;align-items:center;gap:6px}
.perks i{width:6px;height:6px;border-radius:50%;background:var(--good);display:inline-block}

/* product grid */
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:12px 0 18px}
.section-head h2{margin:0;font-size:24px;letter-spacing:-.02em}
.section-head span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding-bottom:56px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--line-2);transform:translateY(-2px)}
.thumb{aspect-ratio:4/3;max-width:100%;background:linear-gradient(160deg,var(--panel-2),#0a1222);display:grid;place-items:center;position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain;background:var(--photo);padding:10px}
.thumb svg{width:46%;height:auto}
.thumb .badge{position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:rgba(8,12,22,.78);border:1px solid var(--line-2);border-radius:999px;padding:3px 8px;color:var(--muted)}
.card-link{display:flex;flex-direction:column;flex:1;color:inherit;text-decoration:none}
.card-link:hover h3{color:var(--accent)}
.card-link:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:18px 18px 0 0}
.card-body{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-body h3{margin:0;font-size:15px;line-height:1.35;letter-spacing:-.01em;flex:1;transition:color .15s}
.card-buy{padding:0 16px 16px}
.price-row{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px}
.price{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--accent)}
.mrp{font-family:var(--mono);font-size:13px;color:var(--dim)}
.off{font-size:13px;font-weight:700;color:var(--good)}

/* add-to-cart button and its − n + counter */
.btn.block{width:100%;justify-content:center}
.btn.lg{font-size:15px;border-radius:12px}
.btn.buy{background:var(--buy);border-color:var(--buy);color:var(--buy-ink)}
.btn.buy:hover{filter:brightness(1.06)}
.buy-ctl .btn,.stepper{height:40px}
.buy-ctl[data-size="lg"] .btn,.stepper.lg,.btn.buy.lg{height:48px}
.stepper{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--accent);border-radius:10px;background:var(--accent-soft);overflow:hidden}
.stepper.lg{border-radius:12px}
.stepper button{height:100%;width:44px;flex:none;background:none;border:0;color:var(--accent);display:grid;place-items:center}
.stepper button:hover:not(:disabled){background:rgba(14,165,255,.2)}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper button svg{width:17px;height:17px}
.stepper span{font-size:14px;color:var(--fg);white-space:nowrap}
.stepper span b{font-family:var(--mono);color:var(--accent);font-size:16px;margin-right:2px}

/* product page */
.pdp{padding-block:22px 64px}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:18px}
.crumbs a{color:var(--accent);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.pdp-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) 300px;grid-template-areas:"gallery info buy";gap:32px;align-items:start}
.gallery{grid-area:gallery;display:flex;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);min-width:0}
.thumbs{display:flex;flex-direction:column;gap:8px}
.tb{width:64px;height:64px;flex:none;border-radius:10px;border:1.5px solid var(--line-2);background:var(--photo);padding:3px;overflow:hidden}
.tb img{width:100%;height:100%;object-fit:contain}
.tb.on,.tb:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.main-photo{flex:1;min-width:0;aspect-ratio:1;max-width:100%;border-radius:18px;background:var(--photo);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.main-photo img{width:100%;height:100%;object-fit:contain;padding:16px}
.main-photo svg{width:55%;height:auto}
.pdp-info{grid-area:info;min-width:0}
.pdp-info h1{font-size:clamp(22px,2.5vw,30px);line-height:1.2;letter-spacing:-.02em;margin:0 0 10px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 18px;max-width:60ch}
.pdp-price{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px;padding-top:16px;border-top:1px solid var(--line)}
.off.big{font-size:24px;font-weight:600}
.price.xl{font-size:34px}
.mrp-line{color:var(--muted);font-size:14px;margin-top:4px}
.mrp-line s{font-family:var(--mono)}
.tax{color:var(--dim);font-size:13px;margin-top:2px}
.about{font-size:17px;margin:24px 0 10px;padding-top:20px;border-top:1px solid var(--line)}
.feats{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:9px;max-width:62ch}
.feats li::marker{color:var(--accent)}
.buybox{grid-area:buy;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.buybox .price.lg{font-size:26px}
.bb-line{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}
.bb-line svg{width:18px;height:18px;flex:none;color:var(--good);margin-top:2px}
.bb-line b{color:var(--fg)}
.bb-out{color:var(--bad);font-weight:700;font-size:15px}
.bb-meta{margin:2px 0 0;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:13px}
.bb-meta div{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px}
.bb-meta dt{color:var(--dim)}
.bb-meta dd{margin:0;color:var(--muted)}
.more{margin-top:52px}
.more .grid{padding-bottom:0}
@media (max-width:1020px){
  .pdp-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"gallery info" "gallery buy"}
  .buybox{position:static}
}
@media (max-width:700px){
  .pdp-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"gallery" "info" "buy";gap:22px}
  .gallery{position:static;flex-direction:column-reverse}
  .thumbs{flex-direction:row}
}
.empty{border:1px dashed var(--line-2);border-radius:16px;padding:40px 20px;text-align:center;color:var(--muted);grid-column:1/-1}

footer{border-top:1px solid var(--line);color:var(--dim);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;padding-block:22px}
footer a{color:var(--muted)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(2,5,12,.6);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer-head h3{margin:0;font-size:18px}
.drawer-body{flex:1;overflow:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.drawer-foot{border-top:1px solid var(--line);padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.line-item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center}
.line-item .mini{width:56px;height:56px;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;overflow:hidden}
.line-item .mini svg{width:60%}
.line-item .mini img{width:100%;height:100%;object-fit:contain;background:var(--photo);padding:3px}
.line-item a.nm{display:block;font-weight:600;font-size:14px;line-height:1.3;color:var(--fg);text-decoration:none}
.line-item a.nm:hover{color:var(--accent)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:8px;margin-top:6px}
.qty button{background:none;border:0;width:30px;height:30px;color:var(--muted)}
.qty span{min-width:22px;text-align:center;font-family:var(--mono);font-size:13px}
.row{display:flex;justify-content:space-between;gap:12px;color:var(--muted)}
.row b{color:var(--fg);font-family:var(--mono)}
.row.total b{color:var(--accent);font-size:20px}
.iconbtn{background:none;border:0;color:var(--muted);padding:6px;border-radius:8px;display:inline-grid;place-items:center}
.iconbtn:hover{color:var(--fg);background:var(--panel-2)}
.iconbtn svg{width:18px;height:18px}
.iconbtn.danger:hover{color:var(--bad)}

/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field label .opt{font-weight:400;color:var(--dim)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.field label.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--fg);padding:10px 0;cursor:pointer}
.field label.check input{width:18px;height:18px;padding:0;flex:none;accent-color:var(--accent)}
.hint{font-size:12px;color:var(--dim)}
.err{color:var(--bad);font-size:13px}
.err:empty{display:none}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.modal-box{position:relative;background:var(--panel);border:1px solid var(--line-2);border-radius:18px;width:min(580px,100%);max-height:calc(100% - 20px);overflow:auto;padding:22px}
.modal-box h3{margin:0 0 16px;font-size:19px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}

/* success */
.done{text-align:center;padding:30px 10px;display:flex;flex-direction:column;align-items:center;gap:10px}
.done .tick{width:56px;height:56px;border-radius:50%;background:rgba(34,197,139,.14);color:var(--good);display:grid;place-items:center}
.done h4{margin:6px 0 0;font-size:20px}
.done p{margin:0;color:var(--muted);max-width:36ch}
.done .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}

/* admin */
.lock{min-height:62vh;display:grid;place-items:center;padding-block:40px}
.lock-box{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;text-align:center}
.lock-box h2{margin:10px 0 6px;font-size:22px}
.lock-box p{margin:0 0 20px;color:var(--muted);font-size:14px}
.lock-box .form{grid-template-columns:1fr;text-align:left}
.pin{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.pin input{width:54px;height:62px;text-align:center;font-family:var(--mono);font-size:26px;font-weight:700;background:var(--bg);border:1px solid var(--line-2);border-radius:12px}
.pin input:focus{border-color:var(--accent);outline:none}
.pin.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding-block:36px 26px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px 26px}
.stat .k{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.stat .v{font-family:var(--mono);font-weight:700;font-size:28px;color:var(--accent);margin-top:4px;overflow-wrap:anywhere}
.tabs{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:2px}
.tabs button{background:none;border:0;padding:6px 10px;border-radius:8px;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--fg);font-weight:600;box-shadow:inset 0 0 0 1px var(--line-2)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:26px 0 16px}
.toolbar p{margin:0;color:var(--muted)}
.table-wrap{border:1px solid var(--line);border-radius:18px;overflow-x:auto;background:var(--panel);margin-bottom:56px}
table{width:100%;border-collapse:collapse;min-width:900px}
th{text-align:left;font-weight:600;font-size:14px;padding:14px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.n,td.n{text-align:right}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
td .acc{color:var(--accent)}
td .grn{color:var(--good)}
.pcell{display:flex;align-items:center;gap:12px;font-weight:500}
.pcell .mini{width:44px;height:44px;flex:none;border-radius:10px;background:var(--panel-2);display:grid;place-items:center;overflow:hidden}
.pcell .mini svg{width:62%}
.pcell .mini img{width:100%;height:100%;object-fit:contain;background:var(--photo);padding:3px}
.sup{text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.sup svg{width:13px;height:13px}
.dropzone{display:flex;gap:14px;align-items:center;border:1.5px dashed var(--line-2);border-radius:12px;padding:12px;background:var(--bg);cursor:pointer}
.dropzone:focus,.dropzone.over{border-color:var(--accent);outline:none;background:var(--accent-soft)}
.dz-text{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);min-width:0}
.dz-text b{color:var(--fg);font-size:14px}
.linkish{color:var(--accent);cursor:pointer;text-decoration:underline;font-weight:600}
.photo-strip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.ph{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--photo);border:1px solid var(--line-2)}
.ph img{width:100%;height:100%;object-fit:contain;padding:3px}
.ph.empty{background:var(--panel-2);display:grid;place-items:center}
.ph.empty svg{width:70%}
.ph-tag{position:absolute;left:4px;bottom:4px;font-family:var(--mono);font-size:10px;letter-spacing:.04em;background:rgba(8,12,22,.82);color:var(--fg);border:0;border-radius:5px;padding:2px 5px}
button.ph-tag{cursor:pointer}
button.ph-tag:hover{background:var(--accent);color:var(--accent-ink)}
.ph-x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;padding:0;background:rgba(8,12,22,.82);color:var(--fg);display:grid;place-items:center}
.ph-x:hover{background:var(--bad)}
.ph-x svg{width:13px;height:13px}
.orders{display:flex;flex-direction:column;gap:14px;margin-bottom:56px}
.order{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:18px}
.order h4{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.order .meta{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.order .meta b{color:var(--fg)}
.order ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.order .acts{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:150px}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px;border:1px solid;white-space:nowrap}
.pill.new{color:var(--warn);border-color:rgba(245,176,61,.4);background:rgba(245,176,61,.08)}
.pill.paid{color:var(--accent);border-color:rgba(14,165,255,.4);background:var(--accent-soft)}
.pill.fulfilled{color:var(--good);border-color:rgba(34,197,139,.4);background:rgba(34,197,139,.08)}
.pill.cancelled{color:var(--dim);border-color:var(--line-2)}
.muted{color:var(--muted)}
.notice{background:var(--panel);border:1px solid var(--line-2);border-radius:14px;padding:16px 18px;color:var(--muted);font-size:14px;margin-top:20px}

.setup{border-color:rgba(245,176,61,.45)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-weight:600;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:calc(100% - 32px);text-align:center}
